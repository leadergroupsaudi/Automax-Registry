openapi: 3.0.3
info:
  title: Automax Registry and Dispatch
  version: 1.0.0
  description: |
    HTTP API for the Automax Registry service (port 8082) and the position adapter (port 8083).

    This file documents the routes that exist today. It is meant for the dispatcher web app and the driver mobile app discussion.

    ## How a fire call is split across services

    1. A citizen calls. The agent works in the dispatcher web app.
    2. The agent creates the incident in **Automax-Backend** (`POST /api/v1/incidents`). That service is not this API.
    3. This service answers "which fire station is nearest?" and "which vehicle (unit) is nearest and available?".
    4. A **service point** is a station. A **resource** is a unit (a vehicle). The unit is also a registry **thing**.
    5. A **shift** is the duty window (for example morning, MON–FRI, 08:00–16:00).
    6. A **resource shift assignment** puts a driver (`user_id` from Automax-Backend) on a unit for a shift.
    7. Live GPS comes from the Caguar tracker into the adapter, not from the phone.

    ## What is not in this API yet

    The database has a `dispatch_assignment` table (incident + unit, status `offered`, `accepted`, `rejected`, `expired`, `completed`, `cancelled`), but there is no HTTP route for it.

    There is also no route for the driver job steps **on the way**, **reached**, **in progress**, and **job done**.
    Resource status is only `available`, `offered`, `dispatched`, or `maintenance`.
    Shift assignment status is only `scheduled`, `active`, `completed`, or `cancelled`.

    Registry routes have no login. The mobile app should not call them directly until auth is added, or until Automax-Backend proxies them.

    ## Response envelope

    Success:

    ```json
    { "success": true, "message": "resource retrieved", "data": {} }
    ```

    Error:

    ```json
    { "success": false, "error": "validation failed", "errors": { "name": "name is required" } }
    ```

    `errors` is present only on field validation failures. Delete responses omit `data`.

servers:
  - url: http://localhost:8082
    description: Registry and dispatch API
  - url: http://localhost:8083
    description: Position adapter (Caguar ingest only)

tags:
  - name: Health
  - name: Things
    description: Registry assets. A vehicle unit is a thing of type vehicle, then linked as a dispatch resource.
  - name: Devices and drivers
    description: Registers a vehicle or a driver in Caguar and, for a vehicle, creates the local thing.
  - name: Credentials
    description: Device API keys. The plaintext secret is returned only by the issue call.
  - name: External refs
    description: Links a thing to a Caguar device id so live GPS updates that thing.
  - name: Channels
  - name: Channel ACL
  - name: Groups
  - name: Resource types
    description: Unit kinds inside a department, for example fire engine or ambulance.
  - name: Resources
    description: Units (vehicles) the dispatcher can send. Nearest lookup is the call-taking query.
  - name: Service points
    description: Stations. Nearest lookup is the fire-station query.
  - name: Shifts
    description: Duty windows. Not a driver's personal roster by itself.
  - name: Shift assignments
    description: Which driver is on which unit, for which shift.
  - name: Positions
    description: Adapter only. Caguar posts tracker fixes here.

paths:
  /health:
    get:
      tags: [Health]
      summary: Service health
      description: |
        On port 8082, `data` is Postgres, Redis, and NATS, each `up` or `down`.
        On port 8083, `data` is `{ "service": "adapter" }`.
      operationId: getHealth
      responses:
        "200":
          description: Service is responding
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: "#/components/schemas/Health"
                          - type: object
                            properties:
                              service:
                                type: string
                                example: adapter

  /registry/things:
    get:
      tags: [Things]
      summary: List things
      operationId: listThings
      parameters:
        - $ref: "#/components/parameters/ThingType"
        - $ref: "#/components/parameters/DepartmentId"
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Things retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Thing"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Things]
      summary: Create a thing
      operationId: createThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThingWrite"
            example:
              name: Engine 12
              type: vehicle
              is_trackable: true
              department_id: 11111111-1111-1111-1111-111111111111
              metadata:
                plate_number: ABC-1234
      responses:
        "201":
          description: Thing created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Thing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /registry/things/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Things]
      summary: Get a thing
      operationId: getThing
      responses:
        "200":
          description: Thing retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Thing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Things]
      summary: Replace a thing
      operationId: updateThing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThingWrite"
      responses:
        "200":
          description: Thing updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Thing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Things]
      summary: Delete a thing
      operationId: deleteThing
      responses:
        "200":
          description: Thing deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /registry/things/{id}/external-refs:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [External refs]
      summary: Link a thing to an external device id
      description: Creates the link, or updates it when the same thing and external system already exist. Returns 201 when created and 200 when updated.
      operationId: upsertExternalRef
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalRefWrite"
            example:
              external_system: traccar-go
              external_id: "4289765883"
      responses:
        "200":
          description: Existing link updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExternalRef"
        "201":
          description: Link created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ExternalRef"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /registry/things/{id}/credentials:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Credentials]
      summary: List credentials for a thing
      description: Does not return the secret.
      operationId: listCredentials
      responses:
        "200":
          description: Credentials retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Credentials]
      summary: Issue a credential
      description: The only response that includes `api_secret`. Store it once. The body is empty.
      operationId: issueCredential
      responses:
        "201":
          description: Credential issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/CredentialIssued"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /registry/things/{id}/credentials/{credentialId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: credentialId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Credentials]
      summary: Revoke a credential
      operationId: revokeCredential
      responses:
        "200":
          description: Credential revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /registry/devices:
    post:
      tags: [Devices and drivers]
      summary: Register a vehicle in Caguar and as a local thing
      description: |
        Requires Caguar to be configured. Creates a trackable thing of type `vehicle`, links `external_system=traccar-go` to `unique_id`, and registers the same device in Caguar.
        `unique_id` or `uniqueId` is required. Plate must look like `ABC-1234` when sent.
      operationId: registerDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistration"
            example:
              name: Engine 12
              unique_id: "4289765883"
              department_id: 11111111-1111-1111-1111-111111111111
              tracker_type: gps
              plate_number: ABC-1234
              chassis_number: CH-100
              phone: "+966500000000"
              model: Fire engine
              category: truck
              disabled: false
      responses:
        "201":
          description: Device registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DeviceResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /registry/drivers:
    post:
      tags: [Devices and drivers]
      summary: Register a driver name in Caguar
      description: |
        Sends the driver to Caguar only. It does not create an Automax user, a shift, or a unit assignment.
        The driver the dispatcher assigns later is `user_id` from Automax-Backend, not this unique id.
      operationId: registerDriver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverRegistration"
            example:
              name: Ali Hassan
              unique_id: DRV-1001
      responses:
        "201":
          description: Driver registered
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DriverResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  /registry/channels:
    get:
      tags: [Channels]
      summary: List channels
      operationId: listChannels
      responses:
        "200":
          description: Channels retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Channel"
    post:
      tags: [Channels]
      summary: Create a channel
      operationId: createChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelWrite"
            example:
              name: fire-ops
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /registry/channels/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Channels]
      summary: Get a channel
      operationId: getChannel
      responses:
        "200":
          description: Channel retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Channels]
      summary: Rename a channel
      operationId: updateChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelWrite"
      responses:
        "200":
          description: Channel updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Channel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Channels]
      summary: Delete a channel
      operationId: deleteChannel
      responses:
        "200":
          description: Channel deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /registry/channels/{id}/acl:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Channel ACL]
      summary: List ACL rows for a channel
      operationId: listChannelAcl
      responses:
        "200":
          description: ACL retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ChannelAcl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Channel ACL]
      summary: Grant a thing access to a channel
      operationId: createChannelAcl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelAclCreate"
      responses:
        "201":
          description: ACL created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChannelAcl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /registry/channels/{id}/acl/{aclId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: aclId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Channel ACL]
      summary: Update publish and subscribe flags
      operationId: updateChannelAcl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelAclUpdate"
      responses:
        "200":
          description: ACL updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ChannelAcl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Channel ACL]
      summary: Remove a thing from a channel
      operationId: deleteChannelAcl
      responses:
        "200":
          description: ACL deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /registry/groups:
    get:
      tags: [Groups]
      summary: List groups
      description: Omit `parent_group_id` to list every group. Pass the literal `null` to list only root groups.
      operationId: listGroups
      parameters:
        - name: parent_group_id
          in: query
          schema:
            type: string
          description: UUID of the parent, or the literal `null` for roots.
      responses:
        "200":
          description: Groups retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Groups]
      summary: Create a group
      operationId: createGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupWrite"
            example:
              name: Station 4
              department_id: 11111111-1111-1111-1111-111111111111
              parent_group_id: null
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /registry/groups/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Groups]
      summary: Get a group
      operationId: getGroup
      responses:
        "200":
          description: Group retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Groups]
      summary: Replace a group
      operationId: updateGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupWrite"
      responses:
        "200":
          description: Group updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Groups]
      summary: Delete a group
      operationId: deleteGroup
      responses:
        "200":
          description: Group deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /dispatch/resource-types:
    get:
      tags: [Resource types]
      summary: List resource types
      description: Without page, data is the full array. With page, the response also includes page, limit, total_items, and total_pages. search matches name, code, and alt name.
      operationId: listResourceTypes
      parameters:
        - $ref: "#/components/parameters/DepartmentId"
        - name: search
          in: query
          schema:
            type: string
        - name: is_active
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        "200":
          description: Resource types retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ResourceType"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Resource types]
      summary: Create a resource type
      operationId: createResourceType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceTypeWrite"
            example:
              department_id: 11111111-1111-1111-1111-111111111111
              name: Fire engine
              acceptance_timeout_seconds: 120
      responses:
        "201":
          description: Resource type created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ResourceType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /dispatch/resource-types/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Resource types]
      summary: Get a resource type
      operationId: getResourceType
      responses:
        "200":
          description: Resource type retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ResourceType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Resource types]
      summary: Replace a resource type
      operationId: updateResourceType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceTypeWrite"
      responses:
        "200":
          description: Resource type updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ResourceType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Resource types]
      summary: Delete a resource type
      operationId: deleteResourceType
      responses:
        "200":
          description: Resource type deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /dispatch/icons:
    post:
      tags: [Resources]
      summary: Upload an icon
      description: |
        Multipart field `file`. PNG, JPG, or SVG, at most 2MB.
        The response `data.path` is the value to store in a unit type or fire station `icon`.
      operationId: uploadDispatchIcon
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Icon stored
        "400":
          $ref: "#/components/responses/BadRequest"
  /dispatch/icons/{id}:
    get:
      tags: [Resources]
      summary: Download an icon
      operationId: getDispatchIcon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Icon bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/svg+xml:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /dispatch/resources:
    get:
      tags: [Resources]
      summary: List units
      description: |
        Filter by station, type, status, driver, location, classification, or active-till date.
        Status is `available`, `offered`, `dispatched`, or `maintenance`.
        `search` matches name, plate, alternate name, radio id, and unit id.
      operationId: listResources
      parameters:
        - name: resource_type_id
          in: query
          schema:
            type: string
            format: uuid
        - name: service_point_id
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ResourceStatus"
        - name: driver_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: location_id
          in: query
          schema:
            type: string
            format: uuid
        - name: classification_id
          in: query
          schema:
            type: string
            format: uuid
        - name: active_till_date
          in: query
          schema:
            type: string
            format: date
        - name: search
          in: query
          schema:
            type: string
        - name: is_active
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Resources retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Resources]
      summary: Register a unit
      description: |
        `thing_id` must already exist. One thing can be only one resource.
        Writing the resource copies type, station, and status onto that thing.
      operationId: createResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceWrite"
            example:
              thing_id: 22222222-2222-2222-2222-222222222222
              resource_type_id: 33333333-3333-3333-3333-333333333333
              service_point_id: 44444444-4444-4444-4444-444444444444
              status: available
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /dispatch/resources/nearest:
    get:
      tags: [Resources]
      summary: Nearest available units
      description: |
        Dispatcher call-taking query. Returns units that are available and on duty, ordered by distance from the incident.

        `department_id` is required. `lat` may be sent as `latitude`, and `lng` as `longitude`.
        `limit` defaults to 10. There is no upper cap in this route.
      operationId: nearestResources
      parameters:
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lng"
        - name: department_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: resource_type_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Nearest resources retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/NearestResource"
        "400":
          $ref: "#/components/responses/BadRequest"

  /dispatch/resources/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Resources]
      summary: Get a unit
      operationId: getResource
      responses:
        "200":
          description: Resource retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Resources]
      summary: Replace a unit
      description: Use this to move a unit to another station or to set `available`, `offered`, `dispatched`, or `maintenance`. This is not the driver job-step update.
      operationId: updateResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceWrite"
      responses:
        "200":
          description: Resource updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Resources]
      summary: Delete a unit
      operationId: deleteResource
      responses:
        "200":
          description: Resource deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /dispatch/service-points:
    get:
      tags: [Service points]
      summary: List stations
      operationId: listServicePoints
      responses:
        "200":
          description: Service points retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ServicePoint"
    post:
      tags: [Service points]
      summary: Create a station
      operationId: createServicePoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicePointWrite"
