              name: Fire Station 4
              department_id: 11111111-1111-1111-1111-111111111111
              location:
                lat: 24.7136
                lng: 46.6753
      responses:
        "201":
          description: Service point created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ServicePoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /dispatch/service-points/nearest:
    get:
      tags: [Service points]
      summary: Nearest stations
      description: |
        Ordered by distance from the incident coordinates.
        `resourceTypeId` and `resource_type_id` are both accepted and optional.
        `limit` defaults to 10 and must be from 1 to 100.
        This route does not filter by department.
      operationId: nearestServicePoints
      parameters:
        - $ref: "#/components/parameters/Lat"
        - $ref: "#/components/parameters/Lng"
        - name: resourceTypeId
          in: query
          schema:
            type: string
            format: uuid
        - name: resource_type_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Nearest service points retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/NearestServicePoint"
        "400":
          $ref: "#/components/responses/BadRequest"

  /dispatch/service-points/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Service points]
      summary: Get a station
      operationId: getServicePoint
      responses:
        "200":
          description: Service point retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ServicePoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Service points]
      summary: Replace a station
      operationId: updateServicePoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServicePointWrite"
      responses:
        "200":
          description: Service point updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ServicePoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Service points]
      summary: Delete a station
      description: |
        Returns 409 while units still use this station as their home.
        `force=true` detaches those units first, then deletes the station.
      operationId: deleteServicePoint
      parameters:
        - name: force
