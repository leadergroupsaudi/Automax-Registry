          $ref: "#/components/schemas/AttributeColors"
    AttributeColors:
      type: object
      description: Map colors for a unit type. Omitted keys keep the current color, or the default on create.
      properties:
        available:
          type: string
          example: "#22A45D"
        busy:
          type: string
          example: "#E23B3B"
        moving_vehicle:
          type: string
          example: "#E0A100"
        offline:
          type: string
          example: "#6B7280"
