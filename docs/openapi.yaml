          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /dispatch/shifts:
    get:
      tags: [Shifts]
      summary: List shifts
      description: Returns every shift. There is no department or driver filter.
      operationId: listShifts
      responses:
        "200":
          description: Shifts retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Shift"
    post:
      tags: [Shifts]
      summary: Create a shift
      description: |
        `days_of_week` is a comma-separated list of `MON,TUE,WED,THU,FRI,SAT,SUN`, at most 20 characters, with no repeats.
        Times are `HH:MM` or `HH:MM:SS` and must differ. `is_active` defaults to true.
      operationId: createShift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftWrite"
            example:
              department_id: 11111111-1111-1111-1111-111111111111
              name: Morning
              start_time: "08:00"
              end_time: "16:00"
              days_of_week: MON,TUE,WED,THU,FRI
              is_active: true
      responses:
        "201":
          description: Shift created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /dispatch/shifts/{id}:
    parameters:
