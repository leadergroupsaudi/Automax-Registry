    get:
      tags: [Shifts]
      summary: Get a shift
      operationId: getShift
      responses:
        "200":
          description: Shift retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Shifts]
      summary: Replace a shift
      operationId: updateShift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftWrite"
      responses:
        "200":
          description: Shift updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Shift"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Shifts]
      summary: Delete a shift
      operationId: deleteShift
      responses:
        "200":
          description: Shift deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /dispatch/resource-shift-assignments:
    get:
      tags: [Shift assignments]
      summary: List driver-to-unit assignments
      description: Returns every assignment. There is no `user_id` filter, so the mobile app cannot ask for "my shift" with this route alone.
      operationId: listAssignments
      responses:
        "200":
          description: Assignments retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Assignment"
    post:
      tags: [Shift assignments]
      summary: Assign a driver to a unit
      description: |
        This is the "agent assigns the driver" step.
        `user_id` is the driver in Automax-Backend. `resource_id` is the unit. `shift_id` is optional.
        Status is `scheduled`, `active`, `completed`, or `cancelled`. Default is `scheduled`.
        `end_at` must be after `start_at` when both are set.
      operationId: createAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentWrite"
            example:
              resource_id: 55555555-5555-5555-5555-555555555555
              user_id: 66666666-6666-6666-6666-666666666666
              shift_id: 77777777-7777-7777-7777-777777777777
              start_at: "2026-11-10T08:00:00Z"
              end_at: "2026-11-10T16:00:00Z"
              status: scheduled
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /dispatch/resource-shift-assignments/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Shift assignments]
      summary: Get one driver assignment
      operationId: getAssignment
      responses:
        "200":
          description: Assignment retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Shift assignments]
      summary: Update a driver assignment
      description: Changes duty status (`scheduled`, `active`, `completed`, `cancelled`). It does not record on-the-way, reached, in progress, or job done.
      operationId: updateAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignmentWrite"
      responses:
        "200":
          description: Assignment updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Assignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Shift assignments]
      summary: Delete a driver assignment
      operationId: deleteAssignment
      responses:
        "200":
          description: Assignment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /ingest/positions:
    post:
      tags: [Positions]
      summary: Ingest a live tracker fix
      description: |
        Caguar calls this. It is not a mobile-app endpoint.
        Requires `Authorization: Bearer <INGEST_TOKEN>`.
        A flat body or Traccar's `{"position":{...}}` body is accepted.
        Success is HTTP 204 with an empty body. `valid: false` or an older `fixTime` is also 204 and does not replace the stored point.
      operationId: ingestPosition
      servers:
        - url: http://localhost:8083
      security:
        - IngestBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionIngest"
            example:
              deviceId: "4289765883"
              deviceName: Engine 12
              latitude: 24.7136
              longitude: 46.6753
              fixTime: "2026-11-10T09:00:00Z"
              valid: true
      responses:
        "204":
          description: Fix accepted or ignored as stale
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    IngestBearer:
      type: http
      scheme: bearer
      description: "INGEST_TOKEN for the position adapter only. Registry routes do not use this token."

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DepartmentId:
      name: department_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    GroupId:
      name: group_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    ThingType:
      name: type
      in: query
      required: false
      schema:
        type: string
      description: Exact thing type, for example `vehicle`.
    Lat:
      name: lat
      in: query
      required: true
      schema:
        type: number
        format: double
        minimum: -90
        maximum: 90
      description: Also accepted as `latitude`.
    Lng:
      name: lng
      in: query
      required: true
      schema:
        type: number
        format: double
        minimum: -180
        maximum: 180
      description: Also accepted as `longitude`.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 10

  responses:
    BadRequest:
      description: Invalid JSON, UUID, or field validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Row does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Unique name, duplicate link, or a row that is still in use
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: Caguar rejected the call
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Caguar is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Success:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
    Error:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
          description: Present only when field validation fails.
    Health:
      type: object
      properties:
        db:
          type: string
          enum: [up, down]
        redis:
          type: string
          enum: [up, down]
        nats:
          type: string
          enum: [up, down]
    Thing:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          example: vehicle
        is_trackable:
          type: boolean
        department_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
          nullable: true
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ThingWrite:
      type: object
      required: [name, type, department_id]
      properties:
        name:
          type: string
          maxLength: 255
        type:
          type: string
          maxLength: 50
        is_trackable:
          type: boolean
        department_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
          nullable: true
        metadata:
          type: object
          additionalProperties: true
    ExternalRefWrite:
      type: object
      required: [external_system, external_id]
      properties:
        external_system:
          type: string
          example: traccar-go
        external_id:
          type: string
          description: Caguar device id.
    ExternalRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        thing_id:
          type: string
          format: uuid
        external_system:
          type: string
        external_id:
          type: string
        synced_at:
          type: string
          format: date-time
    Credential:
      type: object
      properties:
        id:
          type: string
          format: uuid
        api_key:
          type: string
        status:
          type: string
          example: active
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
    CredentialIssued:
      type: object
      properties:
        api_key:
          type: string
        api_secret:
          type: string
          description: Returned only by the issue call.
    DeviceRegistration:
      type: object
      required: [name, department_id]
      properties:
        name:
          type: string
        unique_id:
          type: string
        uniqueId:
          type: string
          description: Camel-case alias of `unique_id`.
        department_id:
          type: string
          format: uuid
        tracker_type:
          type: string
        trackerType:
          type: string
        plate_number:
          type: string
          description: When set, must match `ABC-1234`.
        plateNumber:
          type: string
        chassis_number:
          type: string
        chassisNumber:
          type: string
        phone:
          type: string
        model:
          type: string
        contact:
          type: string
        status:
          type: string
          description: Optional. Leave this out so Caguar starts the device offline and sets it online only when the identifier is valid.
