services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-registry}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-registry}
      POSTGRES_DB: ${DB_NAME:-registry}
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-registry} -d ${DB_NAME:-registry}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - registry_db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    restart: always
    command: ["-js", "-m", "8222"]
    ports:
      - "4224:4222"
      - "8224:8222"

  api:
    image: ${API_IMAGE:-automax-registry:local}
    build: .
    restart: always
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SERVER_HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-registry}
      DB_PASSWORD: ${DB_PASSWORD:-registry}
      DB_NAME: ${DB_NAME:-registry}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NATS_URL: nats://nats:4222
      INGEST_TOKEN: ${INGEST_TOKEN:-local-dev-token}
      INGEST_EXTERNAL_SYSTEM: ${INGEST_EXTERNAL_SYSTEM:-traccar-go}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  registry_db:
