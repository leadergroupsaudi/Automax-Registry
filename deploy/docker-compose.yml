# Server-only compose. Copy this file and a .env. Do not copy the Go source.
# .env must set INGEST_TOKEN.

services:
  db:
    image: yashplg/automax31-postgres:v1
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-registry}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-registry}
      POSTGRES_DB: ${DB_NAME:-registry}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-registry} -d ${DB_NAME:-registry}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - registry_db:/var/lib/postgresql/data

  redis:
    image: yashplg/automax31-redis:v1
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - registry_redis:/data

  nats:
    image: yashplg/automax31-nats:v1
    restart: always
    command: ["-js", "-m", "8222"]

  api:
    image: yashplg/automax31-registry:v1
    restart: always
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SERVER_HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-registry}
      DB_PASSWORD: ${DB_PASSWORD:-registry}
      DB_NAME: ${DB_NAME:-registry}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NATS_URL: nats://nats:4222
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  adapter:
    image: yashplg/automax31-http-adapter:v1
    restart: always
    ports:
      - "8083:8083"
    environment:
      ADAPTER_PORT: 8083
      ADAPTER_HOST: 0.0.0.0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INGEST_TOKEN: ${INGEST_TOKEN:?set INGEST_TOKEN}
    depends_on:
      redis:
        condition: service_healthy

volumes:
  registry_db:
  registry_redis:
